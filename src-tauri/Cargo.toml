[package]
name = "estra-fivem-launcher"
version = "2.3.3"
description = "Estra FiveM Launcher for Windows"
authors = ["Estra FiveM Launcher contributors"]
edition = "2021"

[lib]
name = "estra_fivem_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "io-util", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
regex = "1"
rusty-leveldb = "4"
winreg = "0.52"
uuid = { version = "1", features = ["v4"] }
png = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
